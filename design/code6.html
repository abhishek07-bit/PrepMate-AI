<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>PrepMate AI - Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

                        "on-surface-variant": "#4c4546",
                        "on-surface": "#1a1c1c",
                        "secondary-fixed-dim": "#c7c6c6",
                        "inverse-primary": "#c6c6c6",
                        "on-background": "#1a1c1c",
                        "surface-container-high": "#e8e8e8",
                        "on-secondary": "#ffffff",
                        "primary-container": "#1b1b1b",
                        "surface-tint": "#5e5e5e",
                        "on-tertiary-container": "#848484",
                        "secondary-fixed": "#e3e2e2",
                        "on-error": "#ffffff",
                        "on-error-container": "#93000a",
                        "surface-container-highest": "#e2e2e2",
                        "outline-variant": "#cfc4c5",

                        "error-container": "#ffdad6",
                        "secondary-container": "#e3e2e2",
                        "inverse-surface": "#2f3131",
                        "on-primary-fixed": "#1b1b1b",
                        "on-primary-fixed-variant": "#474747",
                        "inverse-on-surface": "#f1f1f1",
                        "tertiary-fixed-dim": "#c6c6c6",
                        "on-tertiary-fixed-variant": "#474747"
                    },
                    "borderRadius": {
                        "DEFAULT": "1rem",
                        "lg": "2rem",
                        "xl": "3rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "sm": "8px",
                        "max-width": "1200px",
                        "unit": "8px",
                        "md": "16px",
                        "lg": "24px",

                        "container-padding": "32px"
                    },
                    "fontFamily": {
                        "body-md": ["Geist"],
                        "label-sm": ["Geist"],

                    "fontSize": {

<body class="bg-surface-container-low text-on-background min-h-screen flex items-center justify-center p-lg font-body-md text-body-md antialiased">
<!-- Main Container -->
<main class="w-full max-w-max-width mx-auto flex flex-col md:flex-row gap-xl md:gap-24 justify-center items-center">
<!-- Login / Pebble Card -->
<div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-container-padding w-full max-w-md flex flex-col gap-lg">
<!-- Header -->
<div class="flex flex-col gap-sm text-center items-center">
<span class="material-symbols-outlined text-[48px] text-primary" style="font-variation-settings: 'FILL' 1;">view_cozy</span>
<h1 class="font-headline-lg text-headline-lg text-primary tracking-tighter">PrepMate AI</h1>
<p class="font-body-md text-body-md text-secondary">Welcome back. Please enter your details.</p>
</div>
<!-- Form Form -->
<form class="flex flex-col gap-md">
<div class="flex flex-col gap-xs">
<label class="font-label-bold text-label-bold text-on-background" for="email">Email</label>
<input class="bg-surface-container-lowest border border-outline-variant rounded-DEFAULT px-md py-sm focus:border-primary focus:ring-0 font-body-md text-body-md text-on-background placeholder:text-outline outline-none transition-colors" id="email" placeholder="Enter your email" type="email"/>
</div>
<div class="flex flex-col gap-xs">
<label class="font-label-bold text-label-bold text-on-background" for="password">Password</label>
<input class="bg-surface-container-lowest border border-outline-variant rounded-DEFAULT px-md py-sm focus:border-primary focus:ring-0 font-body-md text-body-md text-on-background placeholder:text-outline outline-none transition-colors" id="password" placeholder="••••••••" type="password"/>
</div>
<div class="flex items-center justify-between mt-sm">
<label class="flex items-center gap-sm cursor-pointer">
<input class="rounded-sm border-outline-variant text-primary focus:ring-primary w-4 h-4 bg-surface-container-lowest" type="checkbox"/>
<span class="font-label-sm text-label-sm text-secondary">Remember me</span>
</label>
<a class="font-label-sm text-label-sm text-primary hover:underline" href="#">Forgot password?</a>
</div>
<button class="w-full bg-primary text-on-primary rounded-DEFAULT py-sm font-label-bold text-label-bold mt-sm hover:bg-surface-tint transition-colors" type="button">Sign In</button>
<button class="w-full bg-surface-container-lowest text-primary border border-outline-variant rounded-DEFAULT py-sm font-label-bold text-label-bold flex items-center justify-center gap-sm hover:bg-surface-container-low transition-colors" type="button">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">login</span>
                    Continue with Google
                </button>
</form>
<!-- Footer -->
<div class="text-center mt-sm">
<p class="font-label-sm text-label-sm text-secondary">
                    Don't have an account? <a class="text-primary font-label-bold text-label-bold hover:underline" href="#">Sign up</a>
</p>
</div>
</div>
</main>
</body></html>
